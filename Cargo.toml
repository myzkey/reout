[package]
name = "reout"
version = "0.0.1"
edition = "2024"
description = "Reuse terminal command output after execution"
license = "MIT"
readme = "README.md"
repository = "https://github.com/myzkey/reout"
keywords = ["cli", "terminal", "shell", "history", "sqlite"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
strip-ansi-escapes = "0.2"
terminal_size = "0.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3.16"
