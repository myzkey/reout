[package]
name = "reout"
version = "0.1.0"
edition = "2024"
description = "Reuse terminal command output after execution"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
signal-hook = "0.3"
strip-ansi-escapes = "0.2"
terminal_size = "0.4"
